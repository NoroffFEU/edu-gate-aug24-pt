<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Edugate</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/student-profile.css">
</head>

<body>
    <header id="header"></header>
    <main>

        <div id="card">
            <h1>Edit Profile</h1>
            <img src="../public/icons/user-circle-edit-mobile.png" class="profile-image-mobile"
                alt="student profile picture">
            <img src="../public/icons/profile-icon.png" class="profile-image-desktop" alt="student profile picture">
            <form id="edit-profile-form">
                <label for="name-input">Name:</label>
                <input id="name-input" class="input-top" type="text" placeholder="Joe Bloggs" required>
                <label for="email-input">Email:</label>
                <input id="email-input" class="input-top" type="email" placeholder="joeblog2024@edugate.no" required>
                <label for="dob-input">Date of Birth:</label>
                <input id="dob-input" class="input-top" type="date" placeholder="01/01/2002" required>
                <label for="id-input">ID:</label>
                <input id="id-input" class="input-bottom" type="text" placeholder="0123456" required>
                <label for="year-input">Grad Year:</label>
                <input id="year-input" class="input-bottom" type="number" placeholder="2020" required>
                <label for="school-input">School:</label>
                <input id="school-input" class="input-bottom" type="text" placeholder="The Academy" required>
                <button type="submit" id="save-btn">Update</button>
            </form>
        </div>

    </main>
    <footer id="footer"></footer>
    <script type="module" src="../app.js"></script>
    <script src="../src/student-profile-edit.js"></script>
</body>

</html>
