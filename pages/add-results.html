<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Results - Educate</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/add-results.css" />
</head>

<body>
    <header id="header"></header>
    <main>
        <h1>Add Results</h1>
        <p>To add results, upload an Excel spreadsheet with this format: </p>
        <div class="import-panel">
            <form class="import-form" id="import-form" action="">
                <input type="file" id="excelInput" name="excel" accept=".xlsx, .xls" required>
            </form>
            <div class="form-actions">
                <button type="button" class="upload-btn" id="upload-btn">Upload +</button>
                <a href="teacher-dashboard.html" class="back-link">Back to dashboard</a>
            </div>
        </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../app.js"></script>
    <script type="module" src="../src/add-results.js"></script>
</body>

</html>
